<!DOCTYPE html>
<html lang="en" style="background: transparent !important;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noise Level</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background: transparent !important;">
    <div id="noise-container" class="hidden">
        <div class="noise-ui">
            <div class="noise-header">
                <span class="noise-icon">🔇</span>
                <span class="noise-title">NOISE LEVEL</span>
            </div>
            <div class="noise-bar-container">
                <div class="noise-bar" id="noise-bar"></div>
                <div class="noise-threshold" id="noise-threshold"></div>
            </div>
            <div class="noise-status" id="noise-status">
                <span class="status-text">Stay Quiet</span>
            </div>
            <div class="crouch-hint" id="crouch-hint">
                <span class="hint-key">CTRL</span>
                <span class="hint-text">Press to Crouch</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
